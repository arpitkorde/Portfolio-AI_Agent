steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/github.com/arpitkorde/arpit-korde---portfolio:$COMMIT_SHA',
      '--build-arg', 'VITE_GEMINI_API_KEY=$_VITE_GEMINI_API_KEY',
      '.'
    ]

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/github.com/arpitkorde/arpit-korde---portfolio:$COMMIT_SHA']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'arpit-korde-ai-product-engineer-portfolio'
    - '--image'
    - 'gcr.io/$PROJECT_ID/github.com/arpitkorde/arpit-korde---portfolio:$COMMIT_SHA'
    - '--region'
    - 'us-west1'

images:
  - 'gcr.io/$PROJECT_ID/github.com/arpitkorde/arpit-korde---portfolio:$COMMIT_SHA'

substitutions:
  _VITE_GEMINI_API_KEY: '' # This will be populated by the Trigger setting

options:
  logging: CLOUD_LOGGING_ONLY
